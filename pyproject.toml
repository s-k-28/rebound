[project]
name = "rebound-usdc"
version = "0.1.0"
description = "An address-first inbox for interrupted USDC transfers"
requires-python = ">=3.13"
dependencies = [
  "flet[web]==1.1.2", "fastapi==0.165.0", "uvicorn==0.54.0",
  "httpx==0.28.1", "eth-abi==6.0.0", "eth-utils==6.0.0",
  "eth-hash[pycryptodome]==0.8.0", "eth-account>=0.13.7,<0.15",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "ruff==0.17.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-label="USDC is burned on Base Sepolia, attested by Circle, and Rebound finishes the mint on Arc Testnet">
  <style>
    .t{font:700 19px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#0E1A14}
    .s{font:500 13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#3B4841}
    .m{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#095A3E}
    .n{fill:#fff;stroke:#BDC7C0;stroke-width:1.5}
    .na{fill:#E3F2EA;stroke:#0B6B4A;stroke-width:2}
    .ln{stroke:#BDC7C0;stroke-width:3;stroke-dasharray:6 7;fill:none}
    .gap{stroke:#E8A33A;stroke-width:3;stroke-dasharray:6 7;fill:none}
    .flow{animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-26}}
    .pulse{transform-origin:center;transform-box:fill-box;animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:0;transform:scale(1.35)}}
  </style>
  <rect width="960" height="250" rx="18" fill="#EEF1EE"/>
  <text x="30" y="38" class="m">REBOUND · BASE SEPOLIA → ARC TESTNET · CIRCLE CCTP V2</text>

  <path id="p1" class="ln flow" d="M250 135 H360"/>
  <path id="p2" class="gap flow" d="M600 135 H710"/>
  <path id="track" d="M130 135 H830" fill="none" stroke="none"/>

  <g><rect x="30" y="80" width="220" height="110" rx="14" class="n"/>
    <text x="52" y="116" class="m">1 · BASE SEPOLIA</text><text x="52" y="144" class="t">Burn</text><text x="52" y="168" class="s">USDC leaves the source chain</text></g>
  <g><rect x="360" y="80" width="240" height="110" rx="14" class="n"/>
    <text x="382" y="116" class="m">2 · CIRCLE</text><text x="382" y="144" class="t">Attest</text><text x="382" y="168" class="s">Signed, matched to the burn</text></g>
  <g><rect x="710" y="80" width="220" height="110" rx="14" class="na"/>
    <rect x="710" y="80" width="220" height="110" rx="14" fill="none" stroke="#0B6B4A" stroke-width="3" class="pulse"/>
    <text x="732" y="116" class="m">3 · ARC TESTNET</text><text x="732" y="144" class="t">Mint, finished once</text><text x="732" y="168" class="s">Checks the nonce, then mints</text></g>

  <text x="616" y="122" class="m" style="fill:#9A5B0B">app died?</text>

  <g>
    <circle r="15" fill="#2775CA"/><circle r="11" fill="none" stroke="#fff" stroke-width="1.6"/>
    <text x="0" y="5" text-anchor="middle" style="font:800 12px Helvetica,Arial,sans-serif;fill:#fff">$</text>
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0.17;0.48;0.62;1;1" keyTimes="0;0.15;0.45;0.6;0.9;1" calcMode="linear"><mpath href="#track"/></animateMotion>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;1;1;1;1;0" keyTimes="0;0.05;0.5;0.8;0.93;1"/>
  </g>
  <text x="30" y="226" class="s">Rebound starts from a wallet address, proves all three steps on-chain, and finishes the original mint. It never burns twice.</text>
</svg>
